name: Android mode-4 lightgun test

on:
  push:
    branches:
      - wii-remote-mode4-lightgun
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: platforms/android
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install NDK and CMake
        run: yes | sdkmanager "ndk;29.0.14206865" "cmake;3.31.6" >/dev/null || true

      - name: Fetch shaderc dependencies
        run: python3 app/src/main/cpp/3rdparty/shaderc/utils/git-sync-deps

      - name: Install Rust Android target
        run: rustup target add aarch64-linux-android

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: armsx2-mode4-lightgun
          path: platforms/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
